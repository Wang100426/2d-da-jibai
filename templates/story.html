<!doctype html>
<html lang="{{ {'en': 'en', 'ja': 'ja'}.get(lang, 'zh-CN') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('favicon', lang=lang) }}">
  <title>{{ chapter.title }} · {{ tr("STORY_TITLE") }} · {{ tr("PRODUCT_NAME") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="story-page">
  <div class="scanlines"></div>
  <div class="story-backdrop" id="story-backdrop" aria-hidden="true"></div>

  <header class="story-topbar">
    <a class="select-back story-back" href="/story/choose" aria-label="{{ tr('STORY_BACK_CHOOSE') }}">← <span>{{ tr("STORY_BACK_CHOOSE") }}</span></a>
    <div class="story-heading">
      <small id="story-chapter">{{ chapter.category_name }}</small>
      <b id="story-title">{{ chapter.title }}</b>
    </div>
    <div class="story-tools">
      <span class="story-progress" id="story-progress"></span>
      <button class="story-skip" id="story-skip" type="button">{{ tr("STORY_SKIP") }} <b>»</b></button>
      <div class="language-switch" data-language-switch></div>
    </div>
  </header>

  <main class="story-stage" id="story-stage" aria-live="polite"></main>

  <div class="story-framework-note">{{ tr("STORY_FRAMEWORK_NOTE") }}</div>

  <script>
    window.STORY_CHAPTER = {{ chapter|tojson }};
    window.STORY_PROGRESS = {{ (story.chapters.get(chapter.id) if story and story.chapters else none)|tojson }};
    window.STORY_CHAPTERS = {{ chapters|tojson }};
    window.STORY_ROSTER = {{ roster|tojson }};
    window.STORY_STRINGS = {{ {
      "skip": tr("STORY_SKIP"),
      "continue": tr("STORY_CONTINUE"),
      "clickHint": tr("STORY_CLICK_HINT"),
      "choiceHint": tr("STORY_CHOICE_HINT"),
      "wave": tr("STORY_WAVE"),
      "event": tr("STORY_EVENT"),
      "cooldown": tr("STORY_COOLDOWN"),
      "damage": tr("STORY_DAMAGE"),
      "progress": tr("STORY_PROGRESS"),
      "brief": tr("STORY_BRIEF"),
      "startBattle": tr("STORY_START_BATTLE"),
      "battleKicker": tr("STORY_BATTLE_KICKER"),
      "targetWaves": tr("STORY_TARGET_WAVES"),
      "battleLost": tr("STORY_BATTLE_LOST"),
      "retryBattle": tr("STORY_RETRY_BATTLE"),
      "backChapter": tr("STORY_BACK_CHAPTER"),
      "objectiveKicker": tr("STORY_OBJECTIVE_KICKER"),
      "goalDone": tr("STORY_GOAL_DONE"),
      "goalUndo": tr("STORY_GOAL_UNDO"),
      "objectiveBlocked": tr("STORY_OBJECTIVE_BLOCKED"),
      "rewardKicker": tr("STORY_REWARD_KICKER"),
      "rewardClaiming": tr("STORY_REWARD_CLAIMING"),
      "rewardAlready": tr("STORY_REWARD_ALREADY"),
      "rewardGained": tr("STORY_REWARD_GAINED"),
      "rewardInfinite": tr("STORY_REWARD_INFINITE"),
      "rewardFailed": tr("STORY_REWARD_FAILED"),
      "rewardInvalid": tr("STORY_REWARD_INVALID"),
      "chapterEndKicker": tr("STORY_CHAPTER_END_KICKER"),
      "backChoose": tr("STORY_BACK_CHOOSE"),
      "replay": tr("STORY_REPLAY"),
      "skipFailed": tr("STORY_SKIP_FAILED"),
      "broken": tr("STORY_BROKEN"),
      "unknown_node": tr("STORY_UNKNOWN_NODE"),
      "invalid_transition": tr("STORY_INVALID_TRANSITION")
    }|tojson }};
  </script>
  <script src="{{ url_for('static', filename='story.js') }}"></script>
  <script src="{{ url_for('static', filename='language.js') }}"></script>
  <script src="{{ url_for('static', filename='page-transition.js') }}" defer></script>
</body>
</html>
