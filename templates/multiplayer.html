<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>局域网联机 · 2D大击败</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='multiplayer.css') }}">
</head>
<body class="multiplayer-page">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">2D</span><span><strong>大击败</strong><small>LAN MULTIPLAYER</small></span></a>
    <a class="exit-link" href="/">返回首页 ×</a>
  </header>
  <main class="mp-main">
    <section class="mp-heading">
      <p class="eyebrow">LOCAL NETWORK PARTY</p>
      <h1>局域网联机</h1>
      <p>和同一 Wi-Fi / 局域网里的朋友进入霓虹废墟。玩家攻击、伤害、生命与控制效果由房间服务器同步；肉鸽敌潮和强化仍由各客户端分别模拟。</p>
    </section>
    <section class="mp-layout">
      <div class="mp-panel">
        <h2>加入大厅</h2>
        <label class="mp-label" for="player-name">你的昵称</label>
        <input id="player-name" maxlength="20" placeholder="输入游戏昵称" autocomplete="nickname">
        <label class="mp-label" for="hero-select">选择英雄</label>
        <select id="hero-select">
          {% for hero in heroes %}
          <option value="{{ hero.id }}">{{ hero.name }} · {{ hero.class_name }}</option>
          {% endfor %}
        </select>
        <button class="mp-primary" id="create-room" type="button">创建房间</button>
        <div class="mp-divider"><span>或输入房间码</span></div>
        <div class="join-row"><input id="room-code" maxlength="6" placeholder="例如 A1B2C3"><button id="join-room" type="button">加入</button></div>
        <p class="mp-note">创建房间后，把房间码分享给同一局域网的朋友。</p>
        <div class="lan-address-panel">
          <b>本机局域网地址</b>
          <span id="lan-addresses">正在获取局域网地址…</span>
          <small>同一局域网的玩家可用浏览器打开以上地址加入房间。</small>
        </div>
      </div>
      <div class="mp-panel room-panel">
        <div class="panel-title"><h2>公开房间</h2><button class="refresh-button" id="refresh-rooms" type="button">刷新</button></div>
        <div id="room-list" class="room-list"><p class="empty-state">正在查找房间…</p></div>
      </div>
    </section>
    <section class="mp-panel waiting-panel" id="waiting-room" hidden>
      <div class="panel-title"><div><p class="eyebrow">ROOM LOBBY</p><h2>房间 <strong id="current-room-code"></strong></h2></div><button class="leave-button" id="leave-room" type="button">离开房间</button></div>
      <div class="waiting-players" id="waiting-players"></div>
      <div class="waiting-footer"><p id="waiting-message">等待其他玩家加入…</p><button class="mp-primary start-button" id="start-game" type="button" disabled>开始挑战</button></div>
    </section>
  </main>
  <div class="mp-toast" id="mp-toast" role="status" aria-live="polite"></div>
  <script>window.MP_HEROES = {{ heroes|tojson }};</script>
  <script src="{{ url_for('static', filename='multiplayer.js') }}"></script>
</body>
</html>
